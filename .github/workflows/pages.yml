name: Deploy GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        env:
          CYBERCHEF_VERSION: v11.5.5
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          rm -f build/prod/BundleAnalyzerReport.html
          # 预压缩副本只对支持预压缩的服务器有意义，GitHub Pages 不会用到，去掉以缩小部署包
          find build/prod -type f \( -name '*.js.gz' -o -name '*.js.br' -o -name '*.css.gz' -o -name '*.css.br' -o -name '*.html.gz' -o -name '*.html.br' \) -delete

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/prod

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
